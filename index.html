<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wada Wardrobe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<title>Wada Wardrobe</title>
</head>
<body>
<header><h1>Wada Wardrobe</h1><span id="count"></span></header>

<main>
  <section id="tab-wardrobe">
    <div id="grid" class="grid"></div>
    <p id="empty" class="muted center">No items yet. Tap <b>Add</b> and photograph a garment.</p>
    <details class="backup">
      <summary>Backup</summary>
      <button id="export" class="btn ghost">Export wardrobe</button>
      <label class="btn ghost">Import <input id="import" type="file" accept="application/json" hidden></label>
    </details>
  </section>

  <section id="tab-add" hidden>
    <label class="btn primary big">
      Take / choose photo
      <input id="file" type="file" accept="image/*" hidden>
    </label>
    <p class="muted">Lay the garment flat on a plain surface in daylight. Avoid shadows.</p>
    <div id="work" hidden>
      <div class="cut"><img id="cutimg" alt="Garment cutout"></div>
      <p id="status" class="muted"></p>
      <div id="palette-box" hidden>
        <h3>Colours <small class="muted">tap one to remove it</small></h3>
        <div id="palette" class="palette"></div>
        <label>Name <input id="name" type="text" placeholder="e.g. Navy oxford shirt"></label>
        <label>Category
          <select id="cat">
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
            <option value="outer">Outerwear</option>
            <option value="shoes">Shoes</option>
            <option value="accessory">Accessory</option>
          </select>
        </label>
        <button id="save" class="btn primary big">Save to wardrobe</button>
      </div>
    </div>
  </section>

  <section id="tab-outfits" hidden>
    <div class="controls">
      <label>Tolerance <output id="tolout">20</output>
        <input id="tol" type="range" min="8" max="35" value="20">
      </label>
      <label class="chk"><input id="accents" type="checkbox" checked> Match accent colours (prints, graphics)</label>
      <label class="chk"><input id="full" type="checkbox"> Full matches only</label>
      <label>Build around
        <select id="around"><option value="">Any item</option></select>
      </label>
    </div>
    <div id="results"></div>
  </section>
</main>

<dialog id="detail"><div id="detail-body"></div><form method="dialog"><button class="btn ghost">Close</button></form></dialog>

<nav>
  <button data-tab="wardrobe" class="on">Wardrobe</button>
  <button data-tab="add">Add</button>
  <button data-tab="outfits">Outfits</button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
